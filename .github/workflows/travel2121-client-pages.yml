name: Publicar viajes Travel 2121

on:
  push:
    branches: [main]
    paths:
      - 'client-pages/**'
      - '.github/workflows/travel2121-client-pages.yml'
      - 'scripts/materialize-public-trips.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: travel2121-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Leer el repositorio
        uses: actions/checkout@v4
      - name: Comprobar archivos
        run: |
          test -f client-pages/index.html
          test -d client-pages/viajes
      - name: Preparar HTML completo e imágenes compartidas
        run: python scripts/materialize-public-trips.py client-pages .public-site
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar solo itinerarios públicos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .public-site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
