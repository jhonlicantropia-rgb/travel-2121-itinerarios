<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Tu viaje · Travel 2121</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:15px/1.7 Arial,sans-serif;color:#072c55;background:#f3f6f9}main{max-width:520px;width:100%;padding:32px;background:#fff;border-top:3px solid #bb8e4a;border-radius:14px;box-shadow:0 16px 50px #072c5510}small{color:#94703b;font-size:11px;letter-spacing:2px}h1{font:32px Georgia,serif;margin:16px 0}button,a{display:inline-block;font:inherit;margin:12px 12px 0 0}button{padding:10px 16px;color:white;background:#072c55;border:0;border-radius:8px;cursor:pointer}a{color:#072c55}[hidden]{display:none!important}</style></head><body><!-- travel2121-direct-viewer:v1 --><main><small>TRAVELCORP2121</small><h1>Tu viaje está aquí.</h1><p id="load-status" role="status" aria-live="polite">Abriendo los detalles de tu próxima experiencia…</p><button id="reload" hidden>Volver a intentar</button><a id="fallback" hidden>Abrir versión alternativa</a></main><script>// The permanent GitHub Pages viewer reads an immutable, atomically committed trip.
// It does not depend on a new Pages deployment for each document.
async function loadPublicTrip({fragment,fetchFile,cryptoAPI=crypto,onProgress=()=>{}}){
 const params=new URLSearchParams(fragment.replace(/^#/,'')),id=params.get('viaje'),commit=params.get('commit'),revision=params.get('revision');
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(id||'')||!['commit','revision'].every(key=>/^[a-f0-9]{40}$/.test(params.get(key)||'')))throw Error('El enlace del viaje está incompleto. Solicita a tu asesor que lo copie nuevamente.');
 const base='https://raw.githubusercontent.com/jhonlicantropia-rgb/travel-2121-itinerarios/'+commit+'/client-pages/viajes/'+id+'/';
 const digest=async(algorithm,bytes)=>[...new Uint8Array(await cryptoAPI.subtle.digest(algorithm,bytes))].map(v=>v.toString(16).padStart(2,'0')).join('');
 const text=await fetchFile(base+'index.html',64*1024),bytes=new TextEncoder().encode(text),prefix=new TextEncoder().encode('blob '+bytes.length+'\0'),blob=new Uint8Array(prefix.length+bytes.length);blob.set(prefix);blob.set(bytes,prefix.length);
 if(await digest('SHA-1',blob)!==revision)throw Error('La versión recibida no coincide con tu enlace. Vuelve a intentarlo.');
 let html=text;
 const configText=text.match(/const config=(\{.*?\});document/);
 if(configText){
  const config=JSON.parse(configText[1]);
  if(!Array.isArray(config.files)||config.files.length>400||!config.files.every(name=>/^payload-v[23]-[a-f0-9]{64}-\d+\.txt$/.test(name))||!/^[a-f0-9]{64}$/.test(config.hash||'')||(!config.files.length&&typeof config.data!=='string'))throw Error('El contenido del viaje no es válido.');
  const parts=new Array(config.files.length);let next=0,loaded=0;
  await Promise.all(Array.from({length:Math.min(8,config.files.length)},async()=>{while(next<config.files.length){const index=next++,part=await fetchFile(base+config.files[index],48*1024);if(!/^[A-Za-z0-9+/]*={0,2}$/.test(part))throw Error('No pudimos comprobar una parte del viaje.');parts[index]=part;onProgress(++loaded,parts.length);}}));
  const encoded=config.data||parts.join('');if(encoded.length>20*1024*1024||!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded))throw Error('El contenido del viaje está incompleto.');
  const raw=Uint8Array.from(atob(encoded),v=>v.charCodeAt(0)),data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  if(data.length>12*1024*1024+256||await digest('SHA-256',data)!==config.hash)throw Error('No pudimos comprobar el documento completo. Vuelve a intentarlo.');
  html=new TextDecoder().decode(data);
 }
 if(!/^<!doctype html>/i.test(html)||!html.includes('</html>'))throw Error('El documento del viaje está incompleto.');
 return {html,id};
}
function installPublicTripViewer(){
 const status=document.getElementById('load-status'),retry=document.getElementById('reload'),fallback=document.getElementById('fallback');
 retry.onclick=()=>location.reload();
 const params=new URLSearchParams(location.hash.slice(1)),id=params.get('viaje');
 if(/^[0-9a-f-]{36}$/.test(id||'')){fallback.href='../viajes/'+id+'/';fallback.hidden=false;}
 const fetchFile=async(url,maxBytes)=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{const response=await fetch(url,{credentials:'omit',redirect:'error',signal:controller.signal});if(!response.ok)throw Error('No pudimos abrir el viaje ('+response.status+'). Vuelve a intentarlo.');const text=await response.text();if(new TextEncoder().encode(text).length>maxBytes)throw Error('Una parte del viaje no tiene el tamaño esperado.');return text;}finally{clearTimeout(timer);}
 };
 return loadPublicTrip({fragment:location.hash,fetchFile,onProgress:(done,total)=>{status.textContent='Abriendo tu viaje… '+Math.round(done/total*100)+'%';}}).then(({html})=>{document.open();document.write(html);document.close();}).catch(error=>{status.textContent=error.name==='AbortError'?'La conexión tardó demasiado. Vuelve a intentarlo.':error.message;retry.hidden=false;});
}
