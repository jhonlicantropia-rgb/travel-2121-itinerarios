function walletBase64(bytes){let value='';for(let i=0;i<bytes.length;i+=16384)value+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(value);}
function walletBytes(value){if(typeof value!=='string'||!/^[A-Za-z0-9+/]*={0,2}$/.test(value)||value.length%4)throw new Error('Archivo cifrado inválido.');return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
function walletNewSecret(){return walletBase64(crypto.getRandomValues(new Uint8Array(24))).replace(/\+/g,'-').replace(/\//g,'_');}
function walletEnvelopeValid(e){return !!e&&Object.keys(e).sort().join(',')==='alg,ciphertext,iterations,iv,kdf,salt,v'&&e.v===1&&e.alg==='AES-256-GCM'&&e.kdf==='PBKDF2-SHA256'&&e.iterations===310000&&typeof e.salt==='string'&&/^[A-Za-z0-9+/]{22}==$/.test(e.salt)&&typeof e.iv==='string'&&/^[A-Za-z0-9+/]{16}$/.test(e.iv)&&typeof e.ciphertext==='string'&&e.ciphertext.length>=24&&e.ciphertext.length<=11*1024*1024&&/^[A-Za-z0-9+/]+={0,2}$/.test(e.ciphertext)&&e.ciphertext.length%4===0;}
async function walletKey(secret,salt){if(typeof secret!=='string'||secret.length<20||secret.length>200)throw new Error('Introduce la clave completa de la carpeta (mínimo 20 caracteres).');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:310000},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
function walletValidatePack(pack,id){
 if(!pack||pack.v!==1||pack.id!==id||typeof pack.title!=='string'||pack.title.length>160||typeof pack.traveler!=='string'||pack.traveler.length>160||typeof pack.code!=='string'||!/^DOC-\d{4}-\d{6,}$/.test(pack.code)||!Array.isArray(pack.documents)||!pack.documents.length||pack.documents.length>30)throw new Error('La carpeta no tiene un formato válido.');
 let bytes=0;for(const doc of pack.documents){if(!doc||typeof doc.name!=='string'||!doc.name.trim()||doc.name.length>160||!walletKinds.includes(doc.category))throw new Error('Un documento no tiene un nombre o categoría válido.');
  if(doc.type==='link'){const url=new URL(doc.url);if(url.protocol!=='https:'||url.username||url.password||url.href.length>2000)throw new Error('El enlace debe usar HTTPS.');continue;}
  if(doc.type!=='file'||!['application/pdf','image/jpeg','image/png','image/webp','text/html'].includes(doc.mime))throw new Error('Formato de documento no admitido.');
  const raw=walletBytes(doc.data);bytes+=raw.byteLength;if(!raw.length||bytes>WALLET_MAX_BYTES)throw new Error('La carpeta supera el límite de 6 MB de archivos.');
  if(doc.mime==='application/pdf'&&new TextDecoder().decode(raw.slice(0,5))!=='%PDF-')throw new Error('El PDF no es válido.');
  if(doc.mime==='image/png'&&walletBase64(raw.slice(0,8))!=='iVBORw0KGgo=')throw new Error('La imagen PNG no es válida.');
  if(doc.mime==='image/jpeg'&&!(raw[0]===255&&raw[1]===216&&raw[2]===255))throw new Error('La imagen JPG no es válida.');
  if(doc.mime==='image/webp'&&!(new TextDecoder().decode(raw.slice(0,4))==='RIFF'&&new TextDecoder().decode(raw.slice(8,12))==='WEBP'))throw new Error('La imagen WebP no es válida.');
 }
 return pack;
}
async function walletEncrypt(pack,secret){walletValidatePack(pack,pack.id);const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await walletKey(secret,salt);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('Travel2121/wallet/v1/'+pack.id),tagLength:128},key,new TextEncoder().encode(JSON.stringify(pack)));const envelope={v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations:310000,salt:walletBase64(salt),iv:walletBase64(iv),ciphertext:walletBase64(new Uint8Array(encrypted))};if(!walletEnvelopeValid(envelope))throw new Error('La carpeta cifrada es demasiado grande. Reduce el tamaño de los archivos.');return envelope;}
async function walletDecrypt(envelope,secret,id){if(!walletEnvelopeValid(envelope))throw new Error('La carpeta cifrada no es válida.');const key=await walletKey(secret,walletBytes(envelope.salt));let raw;try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:walletBytes(envelope.iv),additionalData:new TextEncoder().encode('Travel2121/wallet/v1/'+id),tagLength:128},key,walletBytes(envelope.ciphertext));}catch{throw new Error('La clave no es correcta o el archivo fue modificado.');}return walletValidatePack(JSON.parse(new TextDecoder().decode(raw)),id);}

const walletPdfAPI="",walletPdfWorker="";
if(!location.hash)location.hash='acceso=qqOekVp_7QSunhgF7TCIzfvCRyS0KcXB';
const walletId="b159e87e-d207-4348-88fa-513d32726ef0";
(()=>{
let pack=null,objectURL=null,pdfDoc=null,pdfTask=null,pdfRender=null,pdfPage=1,pdfEpoch=0,pdfModule=null;const el=id=>document.getElementById(id),dialog=el('document-dialog');
function closeDocument(){pdfEpoch++;pdfRender?.cancel();pdfRender=null;if(pdfTask)void pdfTask.destroy();pdfTask=null;pdfDoc=null;el("pdf-view").hidden=true;const canvas=el("pdf-canvas");canvas.width=canvas.height=0;el('document-frame').removeAttribute('src');el('document-frame').removeAttribute('srcdoc');el('document-frame').hidden=true;el('image-view').removeAttribute('src');el('image-view').hidden=true;el('open-document').removeAttribute('href');el('download-document').removeAttribute('href');if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null;}}
function lock(){if(dialog.open)dialog.close();closeDocument();pack=null;el('documents').replaceChildren();el('folder-code').textContent='';el('folder-title').textContent='';el('folder-traveler').textContent='';el('opened').hidden=true;el('locked').hidden=false;el('unlock-status').textContent='';}

async function pdfLibrary(){if(!pdfModule)pdfModule=(async()=>{const apiURL=URL.createObjectURL(new Blob([walletBytes(walletPdfAPI)],{type:'text/javascript'}));try{const lib=await import(apiURL);const workerURL=URL.createObjectURL(new Blob([walletBytes(walletPdfWorker)],{type:'text/javascript'}));lib.GlobalWorkerOptions.workerSrc=workerURL;return lib;}finally{URL.revokeObjectURL(apiURL);}})();return pdfModule;}
async function renderPDFPage(epoch){if(!pdfDoc||epoch!==pdfEpoch)return;el('pdf-status').textContent='Cargando página…';el('pdf-prev').disabled=el('pdf-next').disabled=true;try{const page=await pdfDoc.getPage(pdfPage);if(epoch!==pdfEpoch)return;const base=page.getViewport({scale:1}),scale=Math.min(1.5,2000/Math.max(base.width,base.height)),viewport=page.getViewport({scale});const canvas=el('pdf-canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);pdfRender=page.render({canvasContext:canvas.getContext('2d'),viewport});await pdfRender.promise;if(epoch!==pdfEpoch)return;pdfRender=null;el('pdf-page').textContent='Página '+pdfPage+' de '+pdfDoc.numPages;el('pdf-status').textContent='';el('pdf-prev').disabled=pdfPage<=1;el('pdf-next').disabled=pdfPage>=pdfDoc.numPages;}catch(error){if(epoch===pdfEpoch)el('pdf-status').textContent='No se pudo mostrar esta página. Usa Descargar para abrir el PDF.';}}
async function openPDF(doc,epoch){el('pdf-view').hidden=false;el('pdf-status').textContent='Abriendo PDF…';el('pdf-page').textContent='';el('pdf-prev').disabled=el('pdf-next').disabled=true;try{const lib=await pdfLibrary();if(epoch!==pdfEpoch)return;pdfTask=lib.getDocument({data:walletBytes(doc.data),isEvalSupported:false,useSystemFonts:true,disableFontFace:true,enableXfa:false,useWasm:false,useWorkerFetch:false});pdfDoc=await pdfTask.promise;if(epoch!==pdfEpoch)return;pdfPage=1;await renderPDFPage(epoch);}catch(error){if(epoch===pdfEpoch)el('pdf-status').textContent='Este PDF no pudo abrirse aquí. Usa Descargar para consultarlo.';}}
el('pdf-prev').addEventListener('click',()=>{if(pdfDoc&&pdfPage>1){pdfPage--;void renderPDFPage(pdfEpoch);}});el('pdf-next').addEventListener('click',()=>{if(pdfDoc&&pdfPage<pdfDoc.numPages){pdfPage++;void renderPDFPage(pdfEpoch);}});
async function openSharedWallet(){el('unlock-status').textContent='Abriendo tu carpeta…';try{if(!crypto.subtle)throw new Error('Abre el enlace en un navegador actualizado con conexión HTTPS.');pack=await walletDecrypt(JSON.parse(el('wallet-envelope').textContent),new URLSearchParams(location.hash.slice(1)).get('acceso')||'',walletId);el('folder-code').textContent=pack.code;el('folder-title').textContent=pack.title;el('folder-traveler').textContent=pack.traveler;el('documents').replaceChildren();pack.documents.forEach((doc,index)=>{const button=document.createElement('button');button.type='button';button.className='doc-card';button.dataset.document=String(index);for(const [tag,value]of[['small',doc.category],['strong',doc.name],['span',doc.type==='link'?'Abrir enlace ↗':'Ver documento →']]){const node=document.createElement(tag);node.textContent=value;button.append(node);}el('documents').append(button);});el('locked').hidden=true;el('opened').hidden=false;}catch(error){pack=null;el('unlock-status').textContent='Este enlace está incompleto o ya no corresponde a la carpeta. Pide a tu asesora que te comparta el enlace completo.';el('unlock-status').className='error';}finally{}}
void openSharedWallet();

el('documents').addEventListener('click',event=>{const button=event.target.closest('[data-document]');if(!button||!pack)return;const doc=pack.documents[Number(button.dataset.document)];if(!doc)return;closeDocument();el('dialog-title').textContent=doc.name;el('download-document').hidden=doc.type==='link';if(doc.type==='link'){el('open-document').href=doc.url;dialog.showModal();return;}objectURL=URL.createObjectURL(new Blob([walletBytes(doc.data)],{type:doc.mime}));el('open-document').href=objectURL;el('download-document').href=objectURL;el('download-document').download=(doc.name+(doc.mime==='text/html'&&!doc.name.endsWith('.html')?'.html':'')).replace(/[\\/:*?"<>|]/g,'-');if(doc.mime==='application/pdf'){void openPDF(doc,pdfEpoch);}else if(doc.mime.startsWith('image/')){el('image-view').src=objectURL;el('image-view').hidden=false;}else{const frame=el('document-frame');if(doc.mime==='text/html'){frame.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox');frame.srcdoc=new TextDecoder().decode(walletBytes(doc.data));}frame.hidden=false;}dialog.showModal();});
el('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',closeDocument);window.addEventListener('pagehide',lock);
})();
