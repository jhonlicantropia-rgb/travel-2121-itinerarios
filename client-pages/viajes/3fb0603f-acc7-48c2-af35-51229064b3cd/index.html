<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Tu viaje · Travel 2121</title><style>body{font:16px Arial,sans-serif;color:#072c55;background:#f3f6f9;padding:40px;line-height:1.7}main{max-width:560px;margin:auto;padding:32px;background:white;border-top:3px solid #bb8e4a;border-radius:14px}h1{font:30px Georgia,serif}button{padding:12px 18px;color:white;background:#072c55;border:0;border-radius:8px}</style></head><body><main><h1>Preparando tu viaje.</h1><p id="load-status" role="status">Estamos abriendo tus documentos…</p><button id="reload" hidden>Volver a intentar</button></main><script>(async()=>{const config={"files":["payload-v2-691e61c97c3fe705055f657d7fdb577d2dc16885ddec0e9331ff7aebbb1a2d11-0.txt"],"hash":"e4007b33fdeb76f6ddb185f7c26626704bd0db30872bd7debc77b133b0e946e5"};document.getElementById('reload').onclick=()=>location.reload();try{if(!globalThis.DecompressionStream||!crypto.subtle)throw new Error('Usa un navegador actualizado para abrir este viaje.');const parts=await Promise.all(config.files.map(async file=>{const response=await fetch(new URL(file,location.href),{credentials:'omit',redirect:'error'});if(!response.ok)throw new Error('No pudimos cargar una parte del viaje. Vuelve a intentarlo.');const text=await response.text();if(!/^[A-Za-z0-9+/]*={0,2}$/.test(text)||text.length>32768)throw new Error('La página todavía se está actualizando. Vuelve a intentarlo.');return text;}));const raw=Uint8Array.from(atob(parts.join('')),v=>v.charCodeAt(0));const data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hash!==config.hash)throw new Error('La página todavía se está actualizando. Vuelve a intentarlo.');const html=new TextDecoder().decode(data);document.open();document.write(html);document.close();}catch(error){document.getElementById('load-status').textContent=error.message||'No pudimos abrir el viaje.';document.getElementById('reload').hidden=false;}})();</script></body></html>
